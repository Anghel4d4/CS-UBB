<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz — Istoria Informaticii</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; min-height: 100vh; display: flex; flex-direction: column; color: #e2e8f0; }

/* NAV */
nav { background: #111118; border-bottom: 1px solid #1e1e2e; padding: 0 1.5rem; display: flex; align-items: center; gap: 4px; height: 54px; flex-shrink: 0; flex-wrap: wrap; }
nav .brand { color: #e2e8f0; font-size: 15px; font-weight: 600; margin-right: 12px; letter-spacing: -0.2px; white-space: nowrap; }
.nav-sep { width: 1px; height: 22px; background: #2a2a3a; margin: 0 6px; }
.nav-btn { padding: 7px 14px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; border-radius: 8px; transition: background 0.15s, color 0.15s; white-space: nowrap; }
.nav-btn.active { background: #3b82f6; color: #fff; }
.nav-btn:not(.active) { background: transparent; color: #6b7280; }
.nav-btn:not(.active):hover { background: #1e1e2e; color: #c4c9d4; }

/* QUIZ VIEWS */
.quiz-view { flex: 1; display: none; align-items: center; justify-content: center; padding: 2rem; background: #0a0a0f; }
.quiz-view.visible { display: flex; }
.quiz-card { background: #111118; border: 1px solid #1e1e2e; border-radius: 16px; padding: 2.5rem; max-width: 680px; width: 100%; box-shadow: 0 4px 32px rgba(0,0,0,0.5); }

#progress-bar-bg, #progress-bar-bg2, #progress-bar-bg3 { height: 4px; background: #1e1e2e; border-radius: 3px; margin-bottom: 1.5rem; }
#progress-bar, #progress-bar2, #progress-bar3 { height: 4px; background: #3b82f6; border-radius: 3px; transition: width 0.4s ease; }
.q-counter { font-size: 13px; color: #4b5563; margin-bottom: 0.4rem; }
.course-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: #1a2540; color: #60a5fa; border: 1px solid #1e3a6e; margin-bottom: 0.85rem; letter-spacing: 0.2px; }
.q-text { font-size: 20px; font-weight: 600; color: #f1f5f9; margin-bottom: 1.75rem; line-height: 1.5; }

/* Open text */
.input-row { display: flex; gap: 10px; margin-bottom: 1rem; }
.answer-input { flex: 1; padding: 11px 14px; font-size: 15px; border: 1.5px solid #2a2a3a; border-radius: 10px; outline: none; color: #e2e8f0; background: #0d0d15; transition: border-color 0.2s, box-shadow 0.2s; }
.answer-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
.answer-input:disabled { background: #0d0d15; color: #4b5563; }
.answer-input::placeholder { color: #374151; }
.submit-btn { padding: 11px 22px; font-size: 14px; font-weight: 600; border-radius: 10px; border: none; background: #3b82f6; color: #fff; cursor: pointer; transition: background 0.15s, transform 0.1s; }
.submit-btn:hover:not(:disabled) { background: #2563eb; }
.submit-btn:active:not(:disabled) { transform: scale(0.97); }
.submit-btn:disabled { background: #1e3a6e; color: #4b5563; cursor: default; }

/* MC choices */
.choice-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
.choice-btn { padding: 12px 16px; font-size: 15px; text-align: left; border: 1.5px solid #2a2a3a; border-radius: 10px; background: #0d0d15; color: #c4c9d4; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.choice-btn:hover:not(:disabled) { background: #1a2540; border-color: #3b82f6; color: #f1f5f9; }
.choice-btn.selected-correct { background: #0d2818; border-color: #16a34a; color: #4ade80; font-weight: 600; }
.choice-btn.selected-wrong   { background: #2a0d0d; border-color: #dc2626; color: #f87171; font-weight: 600; }
.choice-btn.reveal-correct   { background: #0d2818; border-color: #16a34a; color: #4ade80; font-weight: 600; }

.feedback { display: none; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; font-size: 14px; line-height: 1.6; }
.feedback.correct { background: #0d2818; color: #4ade80; border: 1.5px solid #166534; }
.feedback.wrong   { background: #2a0d0d; color: #f87171; border: 1.5px solid #7f1d1d; }
.feedback .explanation { margin-top: 6px; font-size: 13px; opacity: 0.8; }

.next-btn { display: none; padding: 11px 26px; font-size: 14px; font-weight: 600; border-radius: 10px; border: none; background: #3b82f6; color: #fff; cursor: pointer; transition: background 0.15s; margin-top: 0.25rem; }
.next-btn:hover { background: #2563eb; }

/* Score */
.score-wrap { display: none; text-align: center; padding: 1rem 0; }
.score-wrap h2 { font-size: 26px; font-weight: 700; color: #f1f5f9; margin-bottom: 0.5rem; }
.score-wrap p  { font-size: 15px; color: #6b7280; margin-bottom: 1.75rem; }
.score-ring { width: 120px; height: 120px; margin: 0 auto 1.5rem; }
.restart-btn { padding: 12px 30px; font-size: 15px; font-weight: 600; border-radius: 10px; border: none; background: #3b82f6; color: #fff; cursor: pointer; }
.restart-btn:hover { background: #2563eb; }

/* STUDY VIEWS */
.study-view { display: none; flex: 1; flex-direction: row; }
.study-view.visible { display: flex; }
.study-sidebar { width: 230px; flex-shrink: 0; background: #0d0d15; border-right: 1px solid #1e1e2e; padding: 1.25rem 0; overflow-y: auto; }
.sidebar-title { font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.8px; padding: 0 1.25rem 0.75rem; }
.sidebar-item { display: block; width: 100%; text-align: left; padding: 9px 1.25rem; font-size: 13px; font-weight: 500; border: none; background: transparent; color: #6b7280; cursor: pointer; transition: background 0.12s, color 0.12s; line-height: 1.4; }
.sidebar-item:hover { background: #1e1e2e; color: #c4c9d4; }
.sidebar-item.active { background: #1a2540; color: #60a5fa; border-right: 2px solid #3b82f6; }
.sidebar-item .badge { display: inline-block; margin-left: 6px; font-size: 11px; background: rgba(255,255,255,0.07); border-radius: 10px; padding: 1px 7px; }
.study-main { flex: 1; overflow-y: auto; padding: 2rem 2.5rem; background: #0a0a0f; }
.study-course-title { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #1e1e2e; }
.study-section { display: none; }
.study-section.active { display: block; }

/* QA cards — study 1 */
.qa-card { background: #111118; border: 1px solid #1e1e2e; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; border-left: 3px solid #3b82f6; }
.qa-num { font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.qa-q { font-size: 14px; color: #9ca3af; margin-bottom: 6px; line-height: 1.5; }
.qa-a { font-size: 16px; font-weight: 600; color: #60a5fa; }

/* MC cards — study 2 */
.mc-card { background: #111118; border: 1px solid #1e1e2e; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; border-left: 3px solid #a78bfa; }
.mc-num { font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.mc-q { font-size: 15px; font-weight: 600; color: #f1f5f9; margin-bottom: 10px; line-height: 1.5; }
.mc-choices { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.mc-choice { font-size: 13px; color: #6b7280; padding: 5px 8px; border-radius: 6px; }
.mc-choice.correct-answer { background: #0d2818; color: #4ade80; font-weight: 600; border: 1px solid #166534; }
.mc-explanation { font-size: 13px; color: #4b5563; margin-top: 6px; padding-top: 8px; border-top: 1px solid #1e1e2e; font-style: italic; }

/* ===================== RESPONSIVE MOBILE ===================== */
@media (max-width: 768px) {
  nav {
    height: auto;
    padding: 0.5rem 0.75rem;
    gap: 4px;
    flex-wrap: wrap;
  }
  nav .brand {
    width: 100%;
    font-size: 14px;
    padding: 0.3rem 0;
    margin-right: 0;
  }
  .nav-sep { display: none; }
  .nav-btn {
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 6px;
    flex: 1 1 auto;
    text-align: center;
  }

  .quiz-view {
    padding: 1rem 0.75rem;
    align-items: flex-start;
  }
  .quiz-card {
    padding: 1.25rem 1rem;
    border-radius: 12px;
  }
  .q-text {
    font-size: 16px;
    margin-bottom: 1.25rem;
  }
  .input-row {
    flex-direction: column;
    gap: 8px;
  }
  .answer-input {
    width: 100%;
    font-size: 16px; /* prevent iOS zoom */
  }
  .submit-btn {
    width: 100%;
    padding: 12px;
  }
  .choice-btn {
    font-size: 14px;
    padding: 11px 12px;
  }
  .next-btn {
    width: 100%;
    padding: 12px;
    text-align: center;
  }
  .restart-btn {
    width: 100%;
    padding: 13px;
  }
  .score-wrap h2 { font-size: 20px; }

  /* Study views */
  .study-view {
    flex-direction: column;
  }
  .study-sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #1e1e2e;
    padding: 0.5rem 0;
    /* horizontal scroll on mobile */
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sidebar-title { display: none; }
  .sidebar-item {
    display: inline-block;
    width: auto;
    padding: 8px 14px;
    font-size: 12px;
    border-right: none;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sidebar-item.active {
    border-right: none;
    border-bottom: 2px solid #3b82f6;
    background: #1a2540;
  }
  .study-main {
    padding: 1rem 0.85rem;
    overflow-y: auto;
    flex: 1;
  }
  .study-course-title {
    font-size: 16px;
  }
  .qa-card, .mc-card {
    padding: 1rem;
    border-radius: 10px;
  }
  .qa-a { font-size: 14px; }
  .mc-q { font-size: 14px; }
  .mc-choice { font-size: 12px; }
}

@media (max-width: 400px) {
  .nav-btn { font-size: 11px; padding: 5px 7px; }
  .q-text { font-size: 15px; }
}

</style>
</head>
<body>

<nav>
  <span class="brand">🖥️ Istoria Informaticii</span>

<script>
// ===================== DATA Q1 =====================
const COURSES = {
  "Examen": [
    {q:"Cine a inventat termenul de algoritm?", a:"Abu Abdullah Muhammad ibn Musa al-Khwarizmi"},
    {q:"Cine a creat primul calculator mecanic de interes general?", a:"Charles Babbage"},
    {q:"Cine a rezolvat 'halting problem'?", a:"Alan Turing"},
    {q:"Care a fost primul calculator analogic din istorie?", a:"Antikythera"},
    {q:"Care a aparut primul — lampile (vacuum tubes) sau tranzistoarele?", a:"Lampile (vacuum tubes)", type:"choice", choices:["Lampile (vacuum tubes)","Tranzistoarele"]},
    {q:"Ce firma a creat primul microprocesor din istorie?", a:"Intel (microprocesorul Intel 4004)"},
    {q:"Ce sistem de operare a fost creat in 1970?", a:"UNIX"},
    {q:"Cine a creat GNU si Free Software Foundation?", a:"Richard Matthew Stallman"},
    {q:"Care a fost primul limbaj de programare de nivel inalt din istorie?", a:"Plankalkul (1945)"},
    {q:"Cine a fost parintele internetului?", a:"Vinton Cerf"},
    {q:"Cine a formulat teorema incompletitudinii in matematica?", a:"Kurt Godel"},
    {q:"Ce aveau in comun masina analitica si cea diferentiala ale lui Babbage?", a:"Constructia lor nu a fost dusa la bun sfarsit de Babbage"},
    {q:"Cine a fost Jonathan Postel si ce legatura are cu Internetul?", a:"A editat o perioada lunga de timp documentele RFC"},
    {q:"Ce calcula primul program din istorie (scris de Ada Byron-Lovelace)?", a:"Numerele lui Bernoulli"},
    {q:"Care masina a lui Babbage era de interes general?", a:"Analytical Engine"},
    {q:"Care microcalculator a aparut primul?", a:"Altair 8800", type:"choice", choices:["Altair 8800","Apple I","IBM-PC 5150"]},
    {q:"Ce firma americana a inventat microprocesorul?", a:"Intel"},
    {q:"Cine a inventat masina 'The Bomb'?", a:"Alan Turing"},
    {q:"Cine a fost Richard Matthew Stallman si ce miscare a creat?", a:"Miscarea Free Software"},
    {q:"Cine a inventat cartelele perforate in 1804?", a:"Joseph Marie Jacquard"},
  ],
  "Curs 2": [
    {q:"Cine a inventat algoritmul Merge Sort?", a:"John von Neumann"},
    {q:"In ce revista a aparut prima data termenul 'computer science'?", a:"Communications of the ACM (1959)"},
    {q:"Cum i se mai spunea Teoremei lui Pitagora?", a:"Regula 'Gougu'"},
    {q:"Cine a scris prima carte de matematica riguroasa?", a:"Euclid (Axiomele lui Euclid)"},
    {q:"Cine a masurat diametrul Pamantului?", a:"Eratostene"},

    {q:"Cine a scris o colectie de 13 carti numita 'Aritmetica'?", a:"Diofant"},
    {q:"Cine a inventat numarul 0?", a:"Indienii"},
    {q:"Cine a inventat baza 10?", a:"Arabii"},
  ],
  "Curs 3": [
    {q:"Prin ce se diferentia masina analitica de cea diferentiala ale lui Babbage?", a:"Masina analitica reprezenta numerele in baza 10, cea diferentiala in baza 2"},
    {q:"Care a fost prima masina de calcul de interes general?", a:"Masina analitica a lui Charles Babbage"},

  "Curs 4": [

    {q:"Cum se numeste cel mai celebru premiu in Informatica?", a:"Premiul Turing"},
    {q:"Cine a publicat definitia moderna a numerelor ordinale?", a:"John von Neumann"},
    {q:"Cine a inventat ENIAC si EDVAC?", a:"John von Neumann"},
  ],
  "Curs 5": [
    {q:"Ce calculator calcula pozitia Soarelui si a Lunii in functie de timp?", a:"Antikythera"},
    {q:"Care a fost primul calculator programabil?", a:"Ceasul de castel al lui Al-Jazari (1206)"},
    {q:"Cine a inventat primul calculator digital mecanic?", a:"Wilhelm Schickard"},
    {q:"Cine a construit Pascaline in 1642?", a:"Blaise Pascal"},
    {q:"Cine a inventat aritmometrul in 1800?", a:"Thomas de Colmar"},
    {q:"Care este primul calculator electronic?", a:"ANITAM Mk. VIII (UK, 1962)"},
  ],
  "Curs 6": [
    {q:"Cine a inventat calculatoarele electromecanice Z1, Z2, Z3 si Z4?", a:"Konrad Zuse"},
    {q:"Ce este un ciclu de calcul?", a:"Un ceas"},
    {q:"Care a fost primul calculator programabil care folosea cifre pentru stocarea digitala?", a:"Z3 (Konrad Zuse)"},
    {q:"Care calculator folosea tuburi cu vid (vacuum tubes)?", a:"Colossus (UK, 1943)"},
    {q:"Ce calculatoare au fost folosite pentru a simula traiectoria unei bombe?", a:"ENIAC si EDVAC"},
  ],
  "Curs 7": [
    {q:"Care este primul calculator care stoca programul in memorie?", a:"IBM 7007 (1958)"},
    {q:"Care sunt cele mai vechi limbaje de programare de nivel inalt folosite pana in prezent?", a:"COBOL si Fortran"},
    {q:"Cine a inventat microcipul / circuitul integrat?", a:"Jack Clair Kilby si Robert Noyce"},
    {q:"Care calculator a inceput revolutia calculatoarelor personale?", a:"IBM-PC 5150 (1981)"},

  "Curs 8": [
    {q:"Cine a creat primul OS pentru calculatoare?", a:"General Motors (GM-NAA I/O, 1956)"},
  ],
  "Curs 9": [
    {q:"Care este cea mai importanta standardizare a OS-urilor?", a:"POSIX"},
    {q:"Care a fost primul sistem grafic?", a:"Macintosh System 1 (1984)"},

function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}
function normalize(s){return s.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();}
function levenshtein(a,b){const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
function similar(u,c){u=normalize(u);c=normalize(c);if(u===c)return true;if(c.includes(u)||u.includes(c))return true;return levenshtein(u,c)<=Math.max(1,Math.floor(Math.max(u.length,c.length)*0.25));}

function handleQ1Choice(chosen,correct){
  if(q1Answered)return; q1Answered=true;

}

  document.getElementById('q1-next').style.display='inline-block';
}

    qs.forEach(q=>{
      const correctText=q.choices.find(c=>c[0]===q.correct)||'';
      let choicesHtml=q.choices.map(c=>`<div class="mc-choice${c[0]===q.correct?' correct-answer':''}">${c}</div>`).join('');

  });

}

const Q3_ALL = [];
for (const [topic, qs] of Object.entries(Q3_TOPICS))
  qs.forEach(q => Q3_ALL.push({...q, topic}));

// ===================== QUIZ 3 =====================
let q3Order=[], q3Idx=0, q3Score=0, q3Answered=false;
function startQ3(){
  q3Order=shuffle([...Array(Q3_ALL.length).keys()]); q3Idx=0; q3Score=0;
  document.getElementById('q3-score').style.display='none';
  ['q3-counter','q3-badge','q3-question','q3-feedback','q3-next'].forEach(id=>document.getElementById(id).style.display='');
  showQ3();
}
function showQ3(){
  q3Answered=false;
  const q=Q3_ALL[q3Order[q3Idx]];
  document.getElementById('q3-counter').textContent=`Intrebarea ${q3Idx+1} din ${Q3_ALL.length}`;
  document.getElementById('progress-bar3').style.width=`${(q3Idx/Q3_ALL.length)*100}%`;
  document.getElementById('q3-badge').textContent=`📝 ${q.topic}`;
  document.getElementById('q3-question').textContent=q.q;
  document.getElementById('q3-feedback').style.display='none';
  document.getElementById('q3-next').style.display='none';
  const cl=document.getElementById('q3-choices'); cl.innerHTML='';
  q.choices.forEach((c,i)=>{
    const btn=document.createElement('button'); btn.className='choice-btn';
    btn.textContent=c; btn.dataset.idx=i;
    btn.onclick=()=>handleQ3Choice(btn,q); cl.appendChild(btn);
  });
}
function handleQ3Choice(btn,q){
  if(q3Answered)return; q3Answered=true;
  const chosen=parseInt(btn.dataset.idx); const ok=chosen===q.correct; if(ok)q3Score++;
  document.querySelectorAll('#q3-choices .choice-btn').forEach((b,i)=>{
    b.disabled=true;
    if(parseInt(b.dataset.idx)===chosen) b.classList.add(ok?'selected-correct':'selected-wrong');
    if(!ok && parseInt(b.dataset.idx)===q.correct) b.classList.add('reveal-correct');
  });
  const fb=document.getElementById('q3-feedback'); fb.style.display='block'; fb.className='feedback '+(ok?'correct':'wrong');
  fb.innerHTML=(ok?'&#x2705; <strong>Corect!</strong>':'&#x274C; <strong>Gresit.</strong>')+`<div class="explanation">💡 ${q.explanation}</div>`;
  document.getElementById('q3-next').style.display='inline-block';
}
function nextQ3(){q3Idx++;if(q3Idx>=Q3_ALL.length)scoreQ3();else showQ3();}
function scoreQ3(){
  ['q3-counter','q3-badge','q3-question','q3-feedback','q3-next'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('q3-choices').innerHTML=''; document.getElementById('progress-bar3').style.width='100%';
  const pct=Math.round((q3Score/Q3_ALL.length)*100), C=326.7;
  document.getElementById('q3-score-circle').style.strokeDashoffset=C-(pct/100)*C;
  document.getElementById('q3-score-pct').textContent=pct+'%';
  document.getElementById('q3-score').style.display='block';
  document.getElementById('q3-score-title').textContent=`${q3Score} / ${Q3_ALL.length} corecte`;
  document.getElementById('q3-score-sub').textContent=pct===100?'🏆 Perfect!':pct>=80?'🌟 Foarte bine!':pct>=60?'👍 Bine! Mai ai de studiat.':pct>=40?'📚 Continua sa inveti!':'💪 Nu te descuraja!';
}
document.getElementById('q3-next').addEventListener('click',nextQ3);

// ===================== STUDY 3 =====================
let s3Built=false;
function buildStudy3(){
  s3Built=true;
  const sidebar=document.getElementById('sidebar-s3'), main=document.getElementById('main-s3');
  let globalNum=1;
  Object.entries(Q3_TOPICS).forEach(([topic,qs],i)=>{
    const btn=document.createElement('button'); btn.className='sidebar-item'+(i===0?' active':'');
    btn.dataset.s='s3-'+i; btn.innerHTML=topic+`<span class="badge">${qs.length}</span>`;
    btn.onclick=()=>selectSection('s3',btn,'s3-'+i); sidebar.appendChild(btn);
    const sec=document.createElement('div'); sec.className='study-section'+(i===0?' active':''); sec.id='s3-'+i;
    sec.innerHTML=`<div class="study-course-title">📝 ${topic}</div>`;
    qs.forEach(q=>{
      const correctText=q.choices[q.correct];
      let choicesHtml=q.choices.map((c,ci)=>`<div class="mc-choice${ci===q.correct?' correct-answer':''}">${String.fromCharCode(65+ci)}) ${c}</div>`).join('');
      sec.innerHTML+=`<div class="mc-card"><div class="mc-num">Intrebarea ${globalNum++}</div><div class="mc-q">${q.q}</div><div class="mc-choices">${choicesHtml}</div><div class="mc-explanation">💡 ${q.explanation}</div></div>`;
    });
    main.appendChild(sec);
  });
}
